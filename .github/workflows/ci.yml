name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the tip

      - name: Gitleaks (secrets and personal data, .gitleaks.toml)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format --check
        run: uv run ruff format --check src tests

      - name: Unit tests
        run: uv run pytest -v

      # data/master.yaml is personal and gitignored, so CI runs the pipeline on the checked-in
      # fixtures rather than the author's real resume.
      - name: Build every target (fixtures)
        run: uv run cvops build --all --data-dir tests/fixtures

      - name: Lint every target (ATS compliance, L1-L10)
        run: uv run cvops lint --all --data-dir tests/fixtures

      - name: Upload compiled PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: out/*.pdf
          if-no-files-found: warn
