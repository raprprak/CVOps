[project]
name = "cvops"
version = "0.1.0"
description = "Resume-as-code: compile, lint and JD-match ATS-safe resumes from version-controlled YAML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.0",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "pyyaml>=6.0.3",
    "typer>=0.15.0",
    "typst>=0.14.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
cvops = "cvops.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=4.4.0",  # test-only: synthesizes PDFs for ats_lint unit tests, not a runtime dep
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
